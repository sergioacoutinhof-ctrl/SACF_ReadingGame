; Os dois APKs usam a chave de teste configurada nas preferências locais do Godot.
; O perfil personalizado inclui recursos importáveis locais e o manifesto de personagens.

[preset.0]

name="Android - Generico"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/words.json"
exclude_filter="private/*,tests/*,platform/windows/*"
export_path="../private/builds/aventura-das-letras-generico.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug="res://private/android-templates/android_debug.apk"
custom_template/release="res://private/android-templates/android_release.apk"
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=400
version/name="0.4.0"
package/unique_name="org.sacf.aventuradasletras"
package/name="Aventura das Letras"
package/signed=true
launcher_icons/main_192x192="res://assets/art/icon.svg"
screen/immersive_mode=true
screen/edge_to_edge=false
user_data_backup/allow=false
permissions/internet=false
permissions/record_audio=false
permissions/read_external_storage=false
permissions/write_external_storage=false

